<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f8f7f1">
    <meta name="description" content="完成作业打卡，收集积分，照顾自己的小宠物。">
    <title>作业小宠物</title>
    <link rel="stylesheet" href="./styles.css?v=20261030-pet-room">
    <link rel="stylesheet" href="./pet-room.css?v=20261030-pet-room">
    <script src="./app.js?v=20261030-pet-room" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="#home" aria-label="作业小宠物首页" data-view="home">
          <span class="brand-mark" aria-hidden="true">🐾</span>
          <span class="brand-copy"><strong>作业小宠物</strong><small>认真一点，快乐多一点</small></span>
        </a>
        <nav class="desktop-nav" aria-label="主导航">
          <button class="nav-link active" data-view="home"><span>⌂</span>首页</button>
          <button class="nav-link" data-view="tasks"><span>☑</span>作业打卡</button>
          <button class="nav-link" data-view="pets"><span>♡</span>我的宠物</button>
          <button class="nav-link" data-view="shop"><span>✿</span>积分小铺</button>
        </nav>
        <div class="topbar-side">
          <div class="points-pill"><span>✦</span><strong id="top-points">0</strong><small>积分</small></div>
          <span class="local-badge"><i></i>仅此浏览器</span>
        </div>
      </header>

      <main id="main-view" class="main-content" tabindex="-1"></main>

      <footer class="app-footer">
        <span>🌱 每一步努力，都值得被看见</span>
        <div class="footer-actions">
          <button class="text-button" data-action="export">下载数据备份</button>
          <button class="text-button" data-action="import">恢复备份</button>
          <button class="text-button danger-text" data-action="reset">清空本机数据</button>
        </div>
        <input id="import-file" type="file" accept="application/json,.json" hidden>
      </footer>
    </div>

    <nav class="mobile-nav" aria-label="手机导航">
      <button class="mobile-nav-link active" data-view="home"><span>⌂</span><small>首页</small></button>
      <button class="mobile-nav-link" data-view="tasks"><span>☑</span><small>打卡</small></button>
      <button class="mobile-nav-link" data-view="pets"><span>♡</span><small>宠物</small></button>
      <button class="mobile-nav-link" data-view="shop"><span>✿</span><small>小铺</small></button>
    </nav>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <input id="task-camera-input" type="file" accept="image/*" capture="environment" hidden>
    <input id="task-photo-input" type="file" accept="image/*" multiple hidden>
    <dialog id="photo-viewer" class="photo-viewer" aria-labelledby="viewer-caption">
      <div class="photo-viewer-shell">
        <header class="photo-viewer-header"><strong id="viewer-caption">作业照片</strong><button type="button" class="viewer-button viewer-close" data-action="close-photo-viewer" aria-label="关闭照片预览">×</button></header>
        <div id="viewer-stage" class="photo-viewer-stage"><div class="photo-viewer-canvas"><img id="viewer-image" class="photo-viewer-image" alt="作业照片" data-action="toggle-photo-zoom" hidden></div><p id="viewer-status" class="viewer-status" role="status"></p></div>
        <footer class="photo-viewer-controls"><button type="button" class="viewer-button" data-action="previous-photo" aria-label="上一张照片">‹</button><button type="button" class="viewer-button" data-action="zoom-out" aria-label="缩小照片">−</button><span id="viewer-zoom-label">100%</span><button type="button" class="viewer-button" data-action="zoom-in" aria-label="放大照片">＋</button><button type="button" class="viewer-button viewer-fit" data-action="fit-photo">适应屏幕</button><button type="button" class="viewer-button" data-action="next-photo" aria-label="下一张照片">›</button></footer>
      </div>
    </dialog>
  </body>
</html>
